function rulerSVG() {
  var reach = +S.settings.reach, rim = +S.settings.rim, dunk = +S.settings.dunkTouch;
  var bt = bestTouch();
  var lo = Math.min(reach, 295) - 4, hi = Math.max(dunk, rim, bt.v || 0) + 6;
  var H = 210, W = 150, top = 12, bot = H - 12;
  function y(cm) { return bot - ((cm - lo) / (hi - lo)) * (bot - top); }
  var marks = [
    { cm: dunk, lab: "dunk", col: "var(--ink)", w: 2 },
    { cm: rim, lab: "rim", col: "var(--muted)", w: 1 }
  ];
  var tgt = targetAt(S.ui.pickW);
  marks.push({ cm: tgt, lab: "wk " + S.ui.pickW + " target", col: "var(--faint)", w: 1, dash: "3 3" });
  if (bt.v) marks.push({ cm: bt.v, lab: "best " + bt.v, col: "var(--accent)", w: 2.5 });
  marks.push({ cm: reach, lab: "reach", col: "var(--muted)", w: 1 });

  var s = '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Touch height scale from standing reach to dunk clearance">';
  s += '<rect x="10" y="' + top + '" width="9" height="' + (bot - top) + '" fill="var(--line-soft)" rx="2"></rect>';
  if (bt.v) {
    s += '<rect x="10" y="' + y(bt.v).toFixed(1) + '" width="9" height="' + (bot - y(bt.v)).toFixed(1) + '" fill="var(--accent)" opacity="0.22" rx="2"></rect>';
  }
  /* place the tick at its true height, then push labels apart so none collide */
  marks.forEach(function (m) { m.y = y(m.cm); });
  var ordered = marks.slice().sort(function (a, b) { return a.y - b.y; });
  ordered.forEach(function (m) { m.ly = m.y; });
  for (var k = 1; k < ordered.length; k++) {
    if (ordered[k].ly - ordered[k - 1].ly < 11) ordered[k].ly = ordered[k - 1].ly + 11;
  }
  var spill = ordered.length ? ordered[ordered.length - 1].ly - (bot + 4) : 0;
  if (spill > 0) ordered.forEach(function (m) { m.ly -= spill; });

  marks.forEach(function (m) {
    var yy = m.y.toFixed(1);
    s += '<line x1="6" y1="' + yy + '" x2="23" y2="' + yy + '" stroke="' + m.col + '" stroke-width="' + m.w + '"' + (m.dash ? ' stroke-dasharray="' + m.dash + '"' : "") + "></line>";
    if (Math.abs(m.ly - m.y) > 1.5) {
      s += '<line x1="23" y1="' + yy + '" x2="27" y2="' + m.ly.toFixed(1) + '" stroke="' + m.col + '" stroke-width="0.75" opacity="0.6"></line>';
    }
    s += '<text x="29" y="' + (m.ly + 3.4).toFixed(1) + '" fill="' + m.col + '" font-family="IBM Plex Mono, monospace" font-size="9.5">' +
      Math.round(m.cm) + " · " + m.lab + "</text>";
  });
  return s + "</svg>";
}

function chartSVG() {
  var W = 340, H = 172, L = 30, R = 8, TP = 10, B = 22;
  var pts = [];
  for (var n = 1; n <= 24; n++) {
    var l = S.weeks[n] && S.weeks[n].log;
    if (l && l.app) pts.push({ w: n, v: +l.app });
  }
  var vals = P.targets.map(function (t) { return t.touch; }).concat(pts.map(function (p) { return p.v; }));
  var lo = Math.min.apply(null, vals) - 3, hi = Math.max.apply(null, vals) + 3;
  function x(w) { return L + ((w - 0) / 24) * (W - L - R); }
  function y(v) { return TP + (1 - (v - lo) / (hi - lo)) * (H - TP - B); }

  var s = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Best approach touch by week against the target ladder">';
  var gy = [lo, (lo + hi) / 2, hi].map(function (v) { return Math.round(v); });
  gy.forEach(function (v) {
    s += '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--line-soft)" stroke-width="1"></line>';
    s += '<text x="' + (L - 5) + '" y="' + (y(v) + 3.2).toFixed(1) + '" text-anchor="end" fill="var(--faint)" font-family="IBM Plex Mono, monospace" font-size="9">' + v + "</text>";
  });
  var tp = P.targets.map(function (t) { return x(t.w).toFixed(1) + "," + y(t.touch).toFixed(1); }).join(" ");
  s += '<polyline points="' + tp + '" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-dasharray="4 3"></polyline>';
  if (pts.length) {
    if (pts.length > 1) {
      s += '<polyline points="' + pts.map(function (p) { return x(p.w).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ") +
        '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"></polyline>';
    }
    pts.forEach(function (p, i) {
      var last = i === pts.length - 1;
      s += '<circle cx="' + x(p.w).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '" fill="var(--accent)"></circle>';
      if (last) s += '<text x="' + Math.min(W - R - 2, x(p.w) + 8).toFixed(1) + '" y="' + (y(p.v) - 7).toFixed(1) + '" fill="var(--accent)" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" text-anchor="' + (x(p.w) > W - 60 ? "end" : "start") + '">' + p.v + "</text>";
    });
  }
  [0, 4, 8, 12, 16, 20, 24].forEach(function (w) {
    s += '<text x="' + x(w).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" fill="var(--faint)" font-family="IBM Plex Mono, monospace" font-size="9">' + w + "</text>";
  });
  return s + "</svg>";
}

function viewProg() {
  var week = S.ui.pickW, bt = bestTouch();
  var reach = +S.settings.reach, dunk = +S.settings.dunkTouch;
  var gap = bt.v ? dunk - bt.v : null;
  var vert = bt.v ? bt.v - reach : null;
  var base = P.targets[0].touch;

  var h = '<section class="blk"><span class="eyebrow">Where you are</span>' +
    '<div class="panel lift"><div class="ruler">' + rulerSVG() +
    '<div class="gapnum">' +
    '<div class="big acc">' + (gap != null ? gap : "—") + '<small>cm to a dunk</small></div>' +
    '<div class="big">' + (vert != null ? vert : "—") + '<small>approach vertical</small></div>' +
    "</div></div>" +
    '<div class="stat3" style="border-top:1px solid var(--line-soft)">' +
    '<div><div class="v">' + (bt.v || "—") + '</div><div class="k">best touch</div></div>' +
    '<div><div class="v">' + (bt.v ? (bt.v - base >= 0 ? "+" : "") + (bt.v - base) : "—") + '</div><div class="k">vs week 0</div></div>' +
    '<div><div class="v">' + Math.round(targetAt(week)) + '</div><div class="k">wk ' + week + " target</div></div>" +
    "</div></div></section>";

  h += '<section class="blk"><span class="eyebrow">Approach touch vs target ladder</span>' +
    '<div class="panel" style="padding:10px 8px 4px">' + chartSVG() + "</div>" +
    '<div class="sub">Dashed line is the plan. Log a full test on weeks 4, 8, 12, 16, 20 and 24 only — testing max touch weekly is itself a training stress.</div></section>';

  var L = wk(week).log || {};
  var isTest = TESTWK.indexOf(week) >= 0;
  h += '<section class="blk"><span class="eyebrow">Log week ' + week + (isTest ? " · full test week" : "") + "</span>" +
    '<div class="panel logform">' +
    '<label for="lgR">Standing reach</label><div><input id="lgR" class="numin" type="number" inputmode="decimal" data-act="log" data-f="reach" value="' + (L.reach != null ? L.reach : "") + '" placeholder="' + reach + '"><span class="note">cm</span></div>' +
    '<label for="lgC">Best CMJ touch</label><div><input id="lgC" class="numin" type="number" inputmode="decimal" data-act="log" data-f="cmj" value="' + (L.cmj != null ? L.cmj : "") + '"><span class="note">cm</span></div>' +
    '<label for="lgA">Best approach touch</label><div><input id="lgA" class="numin" type="number" inputmode="decimal" data-act="log" data-f="app" value="' + (L.app != null ? L.app : "") + '"><span class="note">cm</span></div>' +
    "</div>" +
    (L.app ? '<div class="sub">Approach vertical ' + (L.app - reach) + " cm · " + (dunk - L.app) + " cm short of a regulation dunk.</div>" : "") +
    "</section>";

  var stg = currentStage(week);
  h += '<section class="blk"><span class="eyebrow">Dunk progression</span><div class="panel">';
  P.stages.forEach(function (s, i) {
    var reached = L.stage != null ? i <= L.stage - 1 : false;
    var cls = (L.stage != null && i === L.stage - 1) ? "on" : (reached ? "past" : (i === stg && L.stage == null ? "on" : ""));
    h += '<button class="stagerow ' + cls + '" data-act="stage" data-s="' + (i + 1) + '">' +
      '<span class="sn">' + esc(s.stage) + "</span><span class=\"sb\">" +
      '<span class="st">' + esc(s.goal) + "</span>" +
      '<span class="sm">' + esc(s.moveOn) + "</span>" +
      '<span class="sw">weeks ' + esc(s.weeks) + " · needs " + esc(s.touch) + " cm touch · " + esc(s.attempts) + " attempts</span>" +
      "</span></button>";
  });
  h += '</div><div class="sub">Tap the stage you actually reached this week. Stalling: ' + esc(P.stages[stg].stall) + "</div></section>";

  var sq = oneRM("sq", week), tb = oneRM("tb", week);
  var ratio = sq ? sq / +S.settings.bw : null;
  /* --- weights you have logged --- */
  var series = liftSeries();
  var keys = Object.keys(series).sort(function (a, b) {
    return series[b].points.length - series[a].points.length || series[a].label.localeCompare(series[b].label);
  });
  h += '<section class="blk"><span class="eyebrow">Your lifts</span>';
  if (!keys.length) {
    h += '<div class="panel"><div class="hi"><div class="note">No weights logged yet. Type what you lifted into the kg box under any exercise and it will chart here, week by week.</div></div></div></section>';
  } else {
    if (keys.indexOf(S.ui.lift) < 0) S.ui.lift = keys[0];
    h += '<div class="liftpick">';
    keys.forEach(function (k) {
      h += '<button data-act="lift" data-k="' + esc(k) + '" aria-current="' + (k === S.ui.lift ? "true" : "false") + '">' +
        esc(series[k].label) + "</button>";
    });
    h += "</div>";
    var sel = series[S.ui.lift], p = sel.points;
    var first = p[0], last = p[p.length - 1], delta = last.kg - first.kg;
    h += '<div class="panel"><div class="stat3">' +
      '<div><div class="v">' + fmtKg(last.kg) + '</div><div class="k">latest</div></div>' +
      '<div><div class="v" style="color:' + (delta > 0 ? "var(--ok)" : delta < 0 ? "var(--crit)" : "var(--ink)") + '">' +
        (delta > 0 ? "+" : "") + fmtKg(delta) + '</div><div class="k">since wk ' + first.w + "</div></div>" +
      '<div><div class="v">' + p.length + '</div><div class="k">' + (p.length === 1 ? "entry" : "entries") + "</div></div>" +
      "</div>";
    h += p.length > 1
      ? '<div style="padding:8px 8px 4px">' + liftChartSVG(sel) + "</div>"
      : '<div class="hi"><div class="note">One entry so far. Log it again next week and the line starts.</div></div>';
    h += "</div>";
    h += '<div class="panel" style="margin-top:12px"><div class="kv">';
    keys.forEach(function (k) {
      var q = series[k].points, d = q[q.length - 1].kg - q[0].kg;
      h += "<div>" + esc(series[k].label) + "</div><div>" + fmtKg(q[q.length - 1].kg) + " kg" +
        (q.length > 1 ? '<span style="color:' + (d > 0 ? "var(--ok)" : d < 0 ? "var(--crit)" : "var(--faint)") +
          '"> · ' + (d > 0 ? "+" : "") + fmtKg(d) + "</span>" : "") + "</div>";
    });
    h += "</div></div></section>";
  }

  h += '<section class="blk"><span class="eyebrow">Strength</span><div class="panel kv">' +
    "<div>Est. squat 1RM</div><div>" + (sq ? fmtKg(sq) + " kg" : "—") + "</div>" +
    "<div>Est. trap-bar 1RM</div><div>" + (tb ? fmtKg(tb) + " kg" : "—") + "</div>" +
    "<div>Squat : bodyweight</div><div>" + (ratio ? ratio.toFixed(2) + "x" : "—") + "</div>" +
    "<div>Target by week 20</div><div>1.60x · " + fmtKg(r25(1.6 * S.settings.bw)) + " kg</div>" +
    "</div>" +
    '<div class="sub">Retest with a 3–5 rep max on weeks 9 and 17 and enter it in settings — every prescribed load recalculates. Never 1RM test.</div></section>';

  h += '<section class="blk"><span class="eyebrow">Jump log</span><div class="panel scrollx"><table class="data">' +
    "<thead><tr><th>Wk</th><th>CMJ</th><th>App.</th><th>Vert</th><th>Gap</th><th>Jumps</th></tr></thead><tbody>";
  var tp = todayPos();
  for (var n = 1; n <= 24; n++) {
    var lg = (S.weeks[n] && S.weeks[n].log) || {};
    var lh = loggedHI(n);
    var r = (lg.reach || reach);
    h += '<tr class="' + (TESTWK.indexOf(n) >= 0 ? "test " : "") + (tp && tp.w === n ? "now" : "") + '">' +
      "<td>" + n + "</td>" +
      "<td" + (lg.cmj ? "" : ' class="empty"') + ">" + (lg.cmj || "–") + "</td>" +
      "<td" + (lg.app ? "" : ' class="empty"') + ">" + (lg.app || "–") + "</td>" +
      "<td" + (lg.app ? "" : ' class="empty"') + ">" + (lg.app ? lg.app - r : "–") + "</td>" +
      "<td" + (lg.app ? "" : ' class="empty"') + ">" + (lg.app ? dunk - lg.app : "–") + "</td>" +
      "<td" + (lh ? "" : ' class="empty"') + ">" + (lh || "–") + "</td></tr>";
  }
  h += "</tbody></table></div></section>";
  return h;
}

/* ---------------- render: Guide ---------------- */

function viewGuide() {
  var h = '<section class="blk"><span class="eyebrow">Phase map</span><div class="panel">';
  P.phases.forEach(function (p, i) {
    var here = S.ui.w >= +p.weeks.split("-")[0] && S.ui.w <= +p.weeks.split("-")[1];
    h += '<div class="ex"' + (here ? ' style="box-shadow:inset 3px 0 0 var(--accent)"' : "") + ">" +
      '<div class="ex-top"><div class="ex-nm"><b>' + esc(p.phase) + "</b> " +
      '<span class="pre" style="display:inline">weeks ' + esc(p.weeks) + "</span>" +
      '<div class="pre">' + esc(p.objective) + "</div>" +
      '<div class="pre">squat ' + esc(p.squat) + " · " + esc(p.jump).toLowerCase() + " · cap " + esc(p.cap) + "/wk</div>" +
      "</div></div></div>";
  });
  h += "</div></section>";

  h += '<section class="blk"><span class="eyebrow">Drill library · contact cost</span><div class="panel">';
  P.drills.forEach(function (d) {
    h += "<details class=\"acc\"><summary><span class=\"badge " + (d.intensity === "HI" ? "hi" : "li") + '">' + d.intensity + "</span>" + esc(d.name) +
      '<span class="pre" style="color:var(--faint);font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;margin-left:4px">' + esc(d.contacts) + "/set</span></summary>" +
      '<div class="body"><p>' + esc(d.how) + "</p><p style=\"color:var(--crit)\"><b>Fails when</b> " + esc(d.fails) + "</p>" +
      '<p style="color:var(--faint);font-size:12.5px">First used ' + esc(d.first) + "</p></div></details>";
  });
  h += "</div><div class=\"sub\">If you substitute a drill, match the HI count, not the exercise name.</div></section>";

  ["A", "B"].forEach(function (k) {
    var lib = UPPER[k];
    h += '<section class="blk"><span class="eyebrow">Upper ' + k + " · " + esc(lib.title) +
      '</span><div class="panel exlist">';
    lib.ex.forEach(function (e) {
      h += '<div class="r"><span class="n">' + esc(e.name) + (e.note ? "<em>" + esc(e.note) + "</em>" : "") +
        '</span><span class="s">' + e.sets + " x " + (e.count ? "max" : esc(e.reps)) + "</span></div>";
    });
    h += "</div><div class=\"sub\">" + (k === "A" ? "Monday, after the lower session. Leave at least 20 minutes between them."
      : "Wednesday, on its own. The only day with no lower-body impact.") +
      " Deload weeks and weeks 17-24 drop every exercise to 2 sets.</div></section>";
  });

  h += '<section class="blk"><span class="eyebrow">Picking a weight</span><div class="panel">' +
    '<details class="acc" open><summary>The rule that governs everything</summary><div class="body">' +
    "<p>Only the back squat, trap-bar deadlift and front squat carry a prescribed number, because only those are tied to a tested max. Everything else you choose, and the test is the same every time:</p>" +
    "<p><b>The last rep of the last set should be clean, with two or three more left in you.</b> If the bar slows, the weight is too heavy — that is true even when the number on the plan says otherwise.</p>" +
    "<p>Accessories exist to support Tuesday and Thursday. A hard set of split squats that costs you jump height on Tuesday is a loss, not a win. Never grind them.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>Where to start</summary><div class="body">' +
    "<p>Each box shows a suggested starting weight worked out from your tested squat and trap-bar maxes. Use it for the first session, then trust the rep test above over the suggestion.</p>" +
    "<p>Once you log a weight it becomes the placeholder next week, so you always see what you last did.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>When to add weight</summary><div class="body">' +
    "<p>When every set hits the top of its rep range and the last rep is still clean, add <b>2.5 kg</b> to a barbell lift or <b>2 kg per dumbbell</b>, and start again at the bottom of the range.</p>" +
    "<p>Add reps before load on bodyweight work: pull-ups, Nordics, ab wheel, back extensions.</p>" +
    "<p>Calf and tibialis work responds to slow tempo more than heavy load. Hold the pause; do not chase the number.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>Two lifts worth naming</summary><div class="body">' +
    "<p><b>Nordic curl</b> — never add weight. Make it harder by lowering more slowly or using less help from your hands.</p>" +
    "<p><b>Trap-bar jump and jump squat</b> — 20 to 30% of bodyweight, no more. If the bar is heavy enough that you barely leave the floor, it has stopped being a jump.</p>" +
    "</div></details></div></section>";

  h += '<section class="blk"><span class="eyebrow">Running short on time</span><div class="panel">' +
    '<details class="acc" open><summary>What to cut, in order</summary><div class="body">' +
    "<p><b>1. Superset the accessories.</b> Pair things that do not compete: calves with tibialis, lateral raise with sit-ups, chest row with back extension. Saves 10 to 15 minutes and costs nothing.</p>" +
    "<p><b>2. Move the shooting block.</b> The 20 minutes of shooting on Tuesday is skill work, not training load. Do it another time and Tuesday drops by a third.</p>" +
    "<p><b>3. Split the day.</b> Monday is a lower session and a push session. They are allowed to be hours apart — the plan only asks for 20 minutes between them.</p>" +
    "<p><b>4. Cut upper sets from 4 to 3.</b> Costs you the least of anything here.</p>" +
    "<p><b>5. Halve the rim touches</b> on weeks with no dunk window. They overlap with the approach jumps.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>What never to cut</summary><div class="body">' +
    "<p><b>The three-minute rests.</b> Shortening them does not shorten the session, it changes what the session trains — fatigue instead of peak height. If the jump day is too long, do fewer jumps at full rest rather than the same number rushed.</p>" +
    "<p><b>The warm-up.</b> Fifteen minutes, twenty in the last two phases. It does not shrink as the block goes on.</p>" +
    "<p><b>Friday.</b> One blank day is what makes the other six work.</p>" +
    "</div></details></div></section>";

  h += '<section class="blk"><span class="eyebrow">Fitting games in</span><div class="panel">' +
    '<details class="acc"><summary>You have a game on Saturday</summary><div class="body">' +
    "<p><b>Let the game replace Saturday.</b> Saturday is strength with barely any jumping, and the programme's own rule is to skip a missed session rather than stack it somewhere else.</p>" +
    "<p>If you want the lift anyway, move it to Sunday and cut Monday back to the squat alone that week — otherwise you are lifting legs three days in a row.</p>" +
    "<p>Keep Friday as rest either way. It is what makes you fresh for the game.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>You want to play on Sunday</summary><div class="body">' +
    "<p>Fine — Sunday is free. Two conditions: keep it to about 75 minutes, and if it runs long or hard, drop Monday to technique work at 60%.</p>" +
    "<p>Never play both Saturday and Sunday. That is four hard leg days in a row before Tuesday.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>Games count as jumps</summary><div class="body">' +
    "<p>A competitive game is roughly 15 to 25 hard jumps — rebounds, layups, contested shots. The app cannot see those, so add them to your own count when you check the weekly cap.</p>" +
    "<p>On a week with a game, expect to be near the cap before Thursday. Cut Thursday first.</p>" +
    "</div></details>" +
    '<details class="acc"><summary>Dunk window weeks</summary><div class="body">' +
    "<p>Weeks 12, 16, 20 and every Saturday of 21 to 24 are attempt windows, and they sit on Saturdays because you are freshest there. Do not give those Saturdays to a game. If you must, move the window to Sunday and keep Saturday easy.</p>" +
    "</div></details></div></section>";

  h += '<section class="blk"><span class="eyebrow">Rules &amp; recovery</span><div class="panel">';
  P.rules.forEach(function (r) {
    h += '<details class="acc"><summary>' + esc(r.title) + '</summary><div class="body"><p>' + esc(r.text) + "</p></div></details>";
  });
  h += "</div></section>";

  h += '<section class="blk"><span class="eyebrow">Program principles</span><div class="panel">';
  P.principles.forEach(function (p) {
    h += '<div class="ex"><div class="ex-nm"><b>' + esc(p.t) + '</b><div class="pre" style="white-space:normal;font-family:inherit;font-size:13px;margin-top:3px">' + esc(p.d) + "</div></div></div>";
  });
  h += "</div></section>";
  return h;
}

/* ---------------- shell ---------------- */

function applyTheme() {
  var t = S.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}

function paintHeader() {
  var week = S.ui.tab === "today" ? S.ui.w : S.ui.pickW;
  var W = P.weeks[week - 1];
  el("hWk").textContent = "Week " + week;
  el("hDy").textContent = S.ui.tab === "today" ? DAYNM[S.ui.d] : W.phase.replace(/^\d+\s*/, "");
  var c = "";
  if (S.ui.tab === "today") {
    c += '<span class="chip ' + (/DELOAD/i.test(W.load) ? "deload" : "build") + '">' + esc(W.load) + "</span>";
    if (WINDOWWK.indexOf(week) >= 0 && S.ui.d === "sat") c += '<span class="chip window">window</span>';
  }
  el("hChips").innerHTML = c;
  el("prevd").style.visibility = S.ui.tab === "today" ? "visible" : "hidden";
  el("nextd").style.visibility = S.ui.tab === "today" ? "visible" : "hidden";
}

function render() {
  applyTheme();
  paintHeader();
  var v = el("view"), y = window.scrollY;
  v.innerHTML = S.ui.tab === "today" ? viewToday()
    : S.ui.tab === "cal" ? viewCal()
      : S.ui.tab === "prog" ? viewProg() : viewGuide();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (b) {
    b.setAttribute("aria-selected", b.dataset.tab === S.ui.tab ? "true" : "false");
  });
  window.scrollTo(0, Math.min(y, document.body.scrollHeight));
  paintTimer();
}

function stepDay(dir) {
  var i = DAYS.indexOf(S.ui.d) + dir;
  if (i < 0) { if (S.ui.w > 1) { S.ui.w--; S.ui.d = DAYS[6]; } }
  else if (i > 6) { if (S.ui.w < 24) { S.ui.w++; S.ui.d = DAYS[0]; } }
  else S.ui.d = DAYS[i];
  S.ui.pickW = S.ui.w;
  saveLocal(); render();
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button, [data-close]");
  if (!b) return;
  var act = b.dataset.act;

  if (b.dataset.close) { closeSheet(); return; }
  if (b.id === "prevd") return stepDay(-1);
  if (b.id === "nextd") return stepDay(1);
  if (b.id === "btnSet") return openSheet();
  if (b.id === "btnToday") {
    var tp = todayPos();
    if (!tp) return openSheet();
    S.ui.w = tp.w; S.ui.d = tp.d; S.ui.pickW = tp.w; S.ui.tab = "today";
    saveLocal(); return render();
  }
  if (b.classList.contains("tab")) {
    S.ui.tab = b.dataset.tab;
    if (S.ui.tab !== "today") S.ui.pickW = S.ui.pickW || S.ui.w;
    saveLocal(); return render();
  }

  switch (act) {
    case "set": {
      var D = day(S.ui.w, S.ui.d), k = b.dataset.k, i = +b.dataset.i;
      var arr = D.s[k] || (D.s[k] = []);
      arr[i] = !arr[i];
      touchWeek(S.ui.w);
      render();
      break;
    }
    case "timer": startTimer(+b.dataset.s); break;
    case "tstop": stopTimer(); break;
    case "finish": {
      var Df = day(S.ui.w, S.ui.d);
      Df.done = !Df.done;
      touchWeek(S.ui.w); render();
      break;
    }
    case "pickw": S.ui.pickW = +b.dataset.w; saveLocal(); render(); break;
    case "lift": S.ui.lift = b.dataset.k; saveLocal(); render(); break;
    case "mon": {
      var base = S.ui.month ? new Date(+S.ui.month.split("-")[0], +S.ui.month.split("-")[1] - 1, 1)
                            : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      base.setMonth(base.getMonth() + (+b.dataset.v));
      S.ui.month = base.getFullYear() + "-" + String(base.getMonth() + 1).padStart(2, "0");
      saveLocal(); render();
      break;
    }
    case "goday": S.ui.w = +b.dataset.w; S.ui.d = b.dataset.d; S.ui.pickW = S.ui.w; S.ui.tab = "today"; saveLocal(); render(); break;
    case "stage": {
      var L = wk(S.ui.pickW); L.log = L.log || {};
      var sv = +b.dataset.s;
      L.log.stage = L.log.stage === sv ? null : sv;
      touchWeek(S.ui.pickW); render();
      break;
    }
    case "export": exportData(); break;
    case "closeSheet": closeSheet(); break;
  }
});

document.addEventListener("change", function (ev) {
  var t = ev.target, act = t.dataset && t.dataset.act;
  if (!act) return;
  if (act === "import") { if (t.files && t.files[0]) importData(t.files[0]); return; }
  var val = t.value === "" ? null : (t.type === "number" ? +t.value : t.value);

  if (act === "ld") {
    var D = day(S.ui.w, S.ui.d);
    D.ld[t.dataset.k] = D.ld[t.dataset.k] || {};
    D.ld[t.dataset.k][t.dataset.f] = val;
    if (t.dataset.n && val != null) {
      S.settings.lastLoad = S.settings.lastLoad || {};
      S.settings.lastLoad[t.dataset.n] = val;
      S.settings.updatedAt = Date.now();
      pushSettings();
    }
    touchWeek(S.ui.w); render();
  } else if (act === "reps") {
    var Dp = day(S.ui.w, S.ui.d), rk = t.dataset.k;
    Dp.reps = Dp.reps || {};
    Dp.reps[rk] = Dp.reps[rk] || [];
    Dp.reps[rk][+t.dataset.i] = val;
    touchWeek(S.ui.w);
    // update the running total in place — a re-render here would steal focus mid-entry
    var totEl = document.querySelector('[data-tot="' + rk + '"]');
    if (totEl) {
      totEl.textContent = Dp.reps[rk].reduce(function (a, b) { return a + (+b || 0); }, 0);
    }
  } else if (act === "log") {
    var L = wk(S.ui.pickW); L.log = L.log || {};
    L.log[t.dataset.f] = val;
    L.log.date = isoDate(new Date());
    touchWeek(S.ui.pickW); render();
  } else if (act === "cfg") {
    S.settings[t.dataset.f] = val;
    S.settings.updatedAt = Date.now();
    pushSettings(); applyTheme();
    if (t.dataset.f === "start") openSheet();
  } else if (act === "test") {
    var k = t.dataset.k, i = +t.dataset.i;
    S.settings[k] = S.settings[k] || [];
    S.settings[k][i] = S.settings[k][i] || { w: [1, 9, 17][i] };
    S.settings[k][i].w = [1, 9, 17][i];
    S.settings[k][i][t.dataset.f] = val;
    S.settings.updatedAt = Date.now();
    pushSettings();
  }
});

var noteTimer;
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t.dataset || t.dataset.act !== "note") return;
  day(S.ui.w, S.ui.d).note = t.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function () { touchWeek(S.ui.w); }, 500);
});

/* ---------------- boot ---------------- */

loadLocal();
if (!S.settings.start) {
  var d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  S.settings.start = isoDate(d);
  saveLocal();
}
var pos = todayPos();
if (pos && !pos.before && !pos.after) { S.ui.w = pos.w; S.ui.d = pos.d; }
S.ui.pickW = S.ui.pickW || S.ui.w;
render();
connect();

/* Hold long enough for the word to land, then fade the whole thing out.
   Capped so a slow font can never strand you on the launch screen. */
(function () {
  var splash = el("splash");
  if (!splash) return;
  var shown = Date.now();
  var gone = false;
  function done() {
    if (gone) return;
    gone = true;
    setTimeout(function () {
      splash.dataset.off = "1";
      setTimeout(function () { splash.remove(); }, 380);
    }, Math.max(0, 780 - (Date.now() - shown)));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(done).catch(done);
  else done();
  setTimeout(done, 2000);
})();
})();

</script>
