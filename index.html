<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rise</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rise">
<meta name="application-name" content="Rise">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDE9E2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15120E">
<meta name="description" content="24-week two-foot dunk program tracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  html{color-scheme:light dark}
  body{margin:0;font-size:14px}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EDE9E2; --surface:#FBFAF8; --raise:#FFFFFF;
  --ink:#191512; --ink-2:#4A423A; --muted:#6E645A; --faint:#948A7E;
  --line:#DAD3C8; --line-soft:#E6E0D6;
  --accent:#D9450F; --accent-ink:#FFFFFF; --accent-wash:#F7E3DA;
  --ok:#2E7355; --ok-ink:#FFFFFF; --ok-wash:#DFEDE6;
  --warn:#A96A00; --warn-ink:#FFFFFF; --warn-wash:#F5E9D2;
  --crit:#A62A1C; --crit-wash:#F6DED9;
  --shadow:0 1px 2px rgba(25,21,18,.06), 0 6px 18px rgba(25,21,18,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15120E; --surface:#1E1A15; --raise:#262119;
    --ink:#EFE9E0; --ink-2:#CBC2B6; --muted:#9A9086; --faint:#7C7268;
    --line:#332B23; --line-soft:#2A241D;
    --accent:#FF6A33; --accent-ink:#1A0E07; --accent-wash:#392215;
    --ok:#4FB78A; --ok-ink:#08150F; --ok-wash:#16281F;
    --warn:#E0A030; --warn-ink:#211903; --warn-wash:#2E2312;
    --crit:#E8614F; --crit-wash:#341813;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#15120E; --surface:#1E1A15; --raise:#262119;
  --ink:#EFE9E0; --ink-2:#CBC2B6; --muted:#9A9086; --faint:#7C7268;
  --line:#332B23; --line-soft:#2A241D;
  --accent:#FF6A33; --accent-ink:#1A0E07; --accent-wash:#392215;
  --ok:#4FB78A; --ok-ink:#08150F; --ok-wash:#16281F;
  --warn:#E0A030; --warn-ink:#211903; --warn-wash:#2E2312;
  --crit:#E8614F; --crit-wash:#341813;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header.app{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:8px;padding:9px 0 8px}
.hnav{display:flex;align-items:center;gap:2px}
.hnav button{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:6px;font-size:17px;line-height:1}
.hnav button:active{background:var(--line-soft)}
.htitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px}
.htitle .wk{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;line-height:1;white-space:nowrap}
.htitle .dy{font-size:11.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.hchips{display:flex;gap:5px;overflow:hidden}
.chip{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.phase{border-color:transparent;background:var(--line-soft);color:var(--ink-2)}
.chip.build{border-color:var(--ok);color:var(--ok)}
.chip.deload{border-color:transparent;background:var(--warn);color:var(--warn-ink)}
.chip.window{border-color:transparent;background:var(--accent);color:var(--accent-ink)}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel.lift{box-shadow:var(--shadow)}
section.blk{margin:18px 0}
section.blk > .eyebrow{margin-bottom:8px;display:block}
.note{color:var(--muted);font-size:13.5px}
.sub{color:var(--faint);font-size:12.5px;margin-top:6px;line-height:1.45}

.numin{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--raise);
  text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.alert{display:block;padding:11px 12px;border-radius:var(--r);font-size:13.5px;line-height:1.45;margin-bottom:12px}
.alert.crit{background:var(--crit-wash);color:var(--crit);border:1px solid var(--crit)}
.alert.warn{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
.alert.acc{background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent)}
.alert b{font-weight:600}

.sess{margin-bottom:14px}
.sess-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.sess-head .nm{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;letter-spacing:.02em}
.sess-head .meta{font-size:11.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;font-family:"Barlow Condensed",sans-serif}
.ex{padding:10px 12px}
.ex + .ex,.ex + .exnote,.exnote + .ex,.exnote + .exnote,.ex + .exhead,.exnote + .exhead{border-top:1px solid var(--line-soft)}
.ex-top{display:flex;align-items:flex-start;gap:10px}
.ex-nm{flex:1;font-size:14.5px;line-height:1.35}
.ex-nm .pre{color:var(--muted);font-size:12.5px;font-family:"IBM Plex Mono",monospace}
.ex-nm .load{color:var(--accent);font-weight:600}
.setrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.setpill{min-width:38px;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--raise);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);transition:background .12s,color .12s}
.setpill[data-on="1"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);font-weight:600}
.tick{width:30px;height:30px;flex:none;border:1.5px solid var(--line);border-radius:8px;
  display:grid;place-items:center;color:transparent;font-size:15px;line-height:1;background:var(--raise)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.exnote{padding:9px 12px;font-size:13px;color:var(--muted);display:flex;gap:9px}
.exnote i{width:2px;background:var(--line);border-radius:2px;flex:none}
.exhead{padding:10px 12px;background:var(--accent-wash);color:var(--accent);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em}
.loadin{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;color:var(--faint)}
.loadin input{width:66px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--raise);
  text-align:right;font-family:"IBM Plex Mono",monospace;font-size:14px}
.loadin em{font-style:normal;color:var(--faint);font-size:11.5px;line-height:1.3}

.hi{padding:12px}
.hi-top{display:flex;align-items:center;gap:10px}
.hi-n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;line-height:.9;
  font-variant-numeric:tabular-nums;min-width:50px;text-align:center}
.stepbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:9px;font-size:20px;
  display:grid;place-items:center;color:var(--ink-2);background:var(--raise)}
.stepbtn:active{background:var(--line-soft)}
.hi-lab{flex:1;font-size:12.5px;color:var(--muted);line-height:1.35}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:11px;display:flex}
.bar i{display:block;height:100%}
.bar i.fill{background:var(--ok)}
.bar i.over{background:var(--crit)}
.barlab{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--faint);
  font-family:"IBM Plex Mono",monospace}

.timer{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:45;
  display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:24px;
  background:var(--ink);color:var(--ground);box-shadow:var(--shadow);
  font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.timer.run{background:var(--accent);color:var(--accent-ink)}
.timer.done{background:var(--ok);color:var(--ok-ink)}
.timer small{font-size:10.5px;opacity:.8;letter-spacing:.06em;text-transform:uppercase;
  font-family:"Barlow Condensed",sans-serif;font-weight:600}
.timer .x{opacity:.7;font-size:17px;padding:0 1px;color:inherit}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:9px 0 10px;display:grid;justify-items:center;gap:3px;color:var(--faint)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.tab[aria-selected="true"]{color:var(--accent)}

.daylist .d{display:flex;align-items:center;gap:11px;padding:11px 12px;width:100%;text-align:left}
.daylist .d + .d{border-top:1px solid var(--line-soft)}
.daylist .dn{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);width:32px;flex:none}
.daylist .dt{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.daylist .dt s{display:block;color:var(--faint);font-size:11.5px;text-decoration:none;
  font-family:"IBM Plex Mono",monospace;margin-top:2px}
.daylist .d.today{background:var(--accent-wash)}
.daylist .d.today .dn{color:var(--accent)}
.ringwrap{width:24px;height:24px;flex:none}

.kv{display:grid;grid-template-columns:1fr auto}
.kv > div{padding:9px 12px;font-size:13.5px}
.kv > div:nth-child(2n){text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.kv > div:nth-child(2n+1){color:var(--muted)}
.kv > div:nth-child(n+3){border-top:1px solid var(--line-soft)}
.scrollx{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;font-family:"IBM Plex Mono",monospace}
table.data th{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);text-align:right;padding:8px 9px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.data tr.test td{background:var(--warn-wash)}
table.data tr.now td{box-shadow:inset 2px 0 0 var(--accent)}
table.data td.empty{color:var(--faint)}

.ruler{display:flex;padding:14px 12px 12px}
.gapnum{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-left:18px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:.9;
  font-variant-numeric:tabular-nums}
.big small{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.big.acc{color:var(--accent)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr)}
.stat3 > div{padding:11px 12px;border-right:1px solid var(--line-soft)}
.stat3 > div:last-child{border-right:none}
.stat3 .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:23px;line-height:1;
  font-variant-numeric:tabular-nums}
.stat3 .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  font-family:"Barlow Condensed",sans-serif;font-weight:600;margin-top:4px}
.logform{display:grid;grid-template-columns:1fr auto}
.logform > label{padding:10px 12px;font-size:13.5px;color:var(--muted);display:flex;align-items:center}
.logform > div{padding:7px 12px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.logform > *:nth-child(n+3){border-top:1px solid var(--line-soft)}
.stagerow{display:flex;gap:10px;padding:11px 12px;align-items:flex-start;width:100%;text-align:left}
.stagerow + .stagerow{border-top:1px solid var(--line-soft)}
.stagerow .sn{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;color:var(--faint)}
.stagerow.on .sn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stagerow.past .sn{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.stagerow .sb{flex:1;min-width:0}
.stagerow .st{font-size:14px;font-weight:600;line-height:1.3}
.stagerow .sm{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.stagerow .sw{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);margin-top:4px}

details.acc{border-bottom:1px solid var(--line-soft)}
details.acc:last-child{border-bottom:none}
details.acc > summary{padding:12px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:9px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";margin-left:auto;color:var(--faint);font-size:17px;
  font-family:"IBM Plex Mono",monospace}
details.acc[open] > summary::after{content:"\2013"}
details.acc .body{padding:0 12px 13px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
details.acc .body p{margin:0 0 8px}
details.acc .body p:last-child{margin-bottom:0}
.badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 5px;border-radius:4px}
.badge.hi{background:var(--accent);color:var(--accent-ink)}
.badge.li{background:var(--line-soft);color:var(--muted)}
.exlist .r{display:flex;gap:10px;padding:9px 12px;align-items:baseline}
.exlist .r + .r{border-top:1px solid var(--line-soft)}
.exlist .n{flex:1;font-size:13.5px}
.exlist .n em{display:block;font-style:normal;color:var(--faint);font-size:12px;margin-top:2px;line-height:1.4}
.exlist .s{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent);white-space:nowrap}
.exlist .l{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);white-space:nowrap;
  width:54px;text-align:right}

.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet[data-open="1"]{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(10,8,6,.5)}
.sheet .card{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;
  background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet .card > .in{max-width:560px;margin:0 auto;padding:4px 14px 0}
.grab{width:36px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 4px}
.btn{display:block;width:100%;padding:12px;border-radius:var(--r);text-align:center;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid var(--line);background:var(--raise);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.txtin{width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);
  font-size:14px;resize:vertical;min-height:62px;font-family:inherit}
.syncline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);padding:2px 0 0}
.syncdot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.syncdot.on{background:var(--ok)}
.hi-n .of{font-size:17px;color:var(--faint);font-weight:600;margin-left:3px}
.hi-n{min-width:auto;text-align:left;display:flex;align-items:baseline;gap:2px}
.hilist{margin-top:11px;border-top:1px solid var(--line-soft)}
.hirow{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:12.5px;
  border-bottom:1px solid var(--line-soft)}
.hirow:last-child{border-bottom:none}
.hirow span{flex:1;color:var(--ink-2);line-height:1.3}
.hirow b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ok);
  font-variant-numeric:tabular-nums}
.hirow b i{font-style:normal;color:var(--faint);font-weight:400}

.sess-head .dur{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  flex:none;font-variant-numeric:tabular-nums}
.daytime{display:flex;align-items:baseline;gap:9px;margin:-6px 0 16px}
.daytime b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--ink);
  font-variant-numeric:tabular-nums}
.daytime span{font-size:12.5px;color:var(--faint)}

/* ---------- lift picker ---------- */
.liftpick{display:flex;gap:6px;overflow-x:auto;padding:0 0 9px;scrollbar-width:none}
.liftpick::-webkit-scrollbar{display:none}
.liftpick button{flex:none;padding:6px 11px;border:1px solid var(--line);border-radius:20px;
  background:var(--surface);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.liftpick button[aria-current="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- launch: completes the system splash rather than replacing it ---------- */
#splash{position:fixed;inset:0;z-index:200;background:#15120E;
  display:grid;place-items:center;--m:min(80vw,340px);
  opacity:0;animation:splashin .2s ease forwards}
#splash[data-off="1"]{opacity:0;transition:opacity .32s ease;pointer-events:none;animation:none}
#splash svg{width:var(--m);height:var(--m);display:block}
#splash .word{position:absolute;left:0;right:0;text-align:center;
  top:calc(50% + var(--m) / 2 + 20px);
  font-family:"Anton","Barlow Condensed",sans-serif;font-weight:400;
  font-size:min(17vw,72px);line-height:1;letter-spacing:.13em;text-indent:.13em;
  color:#EFE9E0;text-transform:uppercase;
  opacity:0;animation:wordin .34s ease .16s forwards}
@keyframes splashin{to{opacity:1}}
@keyframes wordin{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #splash,#splash .word{animation:none;opacity:1}
  #splash[data-off="1"]{transition:none}
}

/* ---------- three-minute rest ---------- */
.rest3{color:var(--accent)}
.rest3 b{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  border:1px solid var(--accent);border-radius:4px;padding:1px 4px;margin-left:5px;
  white-space:nowrap;letter-spacing:.02em}

/* ---------- daily line ---------- */
section.blk.quote{margin:16px 0 20px}
.quote i{display:block;width:26px;height:3px;border-radius:2px;background:var(--accent);margin-bottom:11px}
.quote p{margin:0;font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:500;
  font-size:19px;line-height:1.35;letter-spacing:.005em;color:var(--ink);text-wrap:pretty;max-width:44ch}
.quote cite{display:block;margin-top:7px;font-style:normal;font-family:"Barlow Condensed",sans-serif;
  font-weight:600;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* ---------- rest guidance ---------- */
.restguide{border-top:1px solid var(--line-soft)}
.rg{display:flex;gap:11px;padding:9px 12px;align-items:baseline}
.rg + .rg{border-top:1px solid var(--line-soft)}
.rg b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink);
  width:38px;flex:none;font-variant-numeric:tabular-nums}
.rg span{flex:1;font-size:12.5px;color:var(--muted);line-height:1.45}
.rg em{font-style:normal;color:var(--accent);font-weight:600}
.rg:first-child b{color:var(--accent)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.calhead .calm{flex:1;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:19px;letter-spacing:.03em}
.calhead button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--muted);font-size:17px;display:grid;place-items:center}
.calhead button:active{background:var(--line-soft)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line-soft);padding:1px}
.cdow{background:var(--surface);text-align:center;padding:7px 0 6px;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.cday{background:var(--surface);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);
  border:none;position:relative;padding:0}
.cday i{width:15px;height:3px;border-radius:2px;background:var(--line);display:block}
.cday.out{color:var(--faint);opacity:.45}
.cday.out i{display:none}
.cday.rest i{background:var(--line-soft)}
.cday.todo i{background:var(--line)}
.cday.part i{background:var(--accent)}
.cday.done i{background:var(--ok)}
.cday.done{color:var(--ink)}
.cday.dl{background:var(--warn-wash)}
.cday.win{box-shadow:inset 0 0 0 2px var(--accent)}
.cday.now{font-weight:600;color:var(--accent)}
.cday.now::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;
  background:var(--accent)}
.callegend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend .k{width:13px;height:3px;border-radius:2px;background:var(--line);display:block}
.callegend .k.done{background:var(--ok)}
.callegend .k.part{background:var(--accent)}
.callegend .k.todo{background:var(--line)}
.callegend .k.win{height:11px;width:11px;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.callegend .k.dl{height:11px;width:11px;border-radius:3px;background:var(--warn-wash);
  box-shadow:inset 0 0 0 1px var(--warn)}

/* ---------- rep-counted sets ---------- */
.reptot{text-align:right;flex:none;font-family:"Barlow Condensed",sans-serif}
.reptot b{display:block;font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  color:var(--accent)}
.reptot small{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.repcell{display:flex;flex-direction:column;align-items:center;gap:3px}
.repcell small{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:11px;color:var(--faint)}
.repcell input{width:52px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--raise);
  text-align:center;font-family:"IBM Plex Mono",monospace;font-size:15px;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

pose":"Pressing in the scapular plane. Kinder to the shooting shoulder than overhead."},{"name":"Scapular pull-up","sets":"3 x 8","load":"Bodyweight","purpose":"Teaches the shoulder blade to move before the arm does."},{"name":"Cable / band external rotation","sets":"3 x 15 / side","load":"Light","purpose":"Cuff. Non-negotiable if you shoot volume."},{"name":"Wrist flexion + extension","sets":"3 x 15 each","load":"Light","purpose":"Shooting wrist and the ball-control end of dunking."},{"name":"Farmer carry","sets":"3 x 30 m","load":"Heavy","purpose":"Grip, trunk, and the thing that eventually lets you palm a ball."},{"name":"Neck + upper trap isometrics","sets":"2 x 20 s","load":"Light","purpose":"Cheap insurance for a contact sport."}]}},"drills":[{"name":"Ankle pogo","intensity":"LI","contacts":"15-20","first":"Week 1","how":"Stiff ankles, knees near-locked, minimal ground time. Bounce from the calf and Achilles, not the hip.","fails":"Knees start bending — you have turned it into a squat jump."},{"name":"Snap-down","intensity":"LI","contacts":"5","first":"Week 1","how":"From tall, drop hard into the athletic landing position and freeze. Teaches deceleration before you train acceleration.","fails":"You land soft and quiet but out of position."},{"name":"Broad jump","intensity":"HI","contacts":"3","first":"Week 1","how":"Two-foot horizontal max effort. Stick the landing every rep. Excellent force-production check.","fails":"Landing is a stumble — reduce distance."},{"name":"Countermovement jump (CMJ)","intensity":"HI","contacts":"2-3","first":"Week 1","how":"Standing vertical, no steps. Your cleanest week-to-week progress metric because nothing about it varies.","fails":"You add a step. Then it is not a CMJ."},{"name":"Approach jump (two-foot)","intensity":"HI","contacts":"1-2","first":"Week 1","how":"Fast, faster, long penultimate step, quick double-foot plant, arms up hard. This is the actual competition lift.","fails":"The penultimate step shortens — you are decelerating too early."},{"name":"Rim touch","intensity":"HI","contacts":"1","first":"Week 1","how":"Approach jump with a target. Reach with one hand, not both.","fails":"You start reaching before you are at peak height."},{"name":"Box jump","intensity":"HI","contacts":"3","first":"Week 1","how":"Concentric-focused. Step down, never jump down. Height should let you land in a quarter squat, not a full one.","fails":"You need a deep catch to land — box is too tall."},{"name":"Bounds","intensity":"LI","contacts":"4-5 / side","first":"Week 1","how":"Alternate-leg horizontal bounding. Builds single-leg elastic quality and hamstring tolerance.","fails":"You are running, not bounding."},{"name":"Altitude landing","intensity":"LI","contacts":"3","first":"Week 5","how":"Step off a 40 cm box, absorb, stick. The prerequisite for depth jumps — do it for 4 weeks first.","fails":"Any knee valgus on landing. Stop and lower the box."},{"name":"Trap-bar jump","intensity":"LI","contacts":"2-3","first":"Week 1","how":"Light trap-bar (20-30% BW), jump for height, land soft. Bridges the strength and jump sessions.","fails":"Load is heavy enough that you barely leave the floor."},{"name":"Jump squat","intensity":"LI","contacts":"3-4","first":"Week 9","how":"20-30% bodyweight on the bar, maximum intent every rep.","fails":"Bar speed drops within a set — cut the set."},{"name":"Depth jump","intensity":"HI","contacts":"2-3","first":"Week 9","how":"Step off a 30 cm box, minimum ground contact, jump immediately. Highest-value and highest-risk drill in the program.","fails":"Ground contact is visibly long. Lower the box or stop."},{"name":"Depth jump → vertical","intensity":"HI","contacts":"2","first":"Week 13","how":"Depth jump straight into a max vertical reach. The most sport-specific plyometric here.","fails":"Second jump is lower than a fresh CMJ. You are fatigued."},{"name":"Hurdle jump","intensity":"HI","contacts":"2-3","first":"Week 13","how":"Continuous two-foot hops over 40-60 cm hurdles. Short contacts, no pause between.","fails":"You pause between hurdles — the elastic component is gone."},{"name":"Dunk attempt","intensity":"HI","contacts":"1","first":"Week 12","how":"Full approach, full intent, 3 minutes rest. Every attempt is a max effort and should be logged as one.","fails":"Two consecutive attempts clearly below your best. Stop for the day."},{"name":"Sprint (15-20 m)","intensity":"LI","contacts":"1","first":"Week 1","how":"Acceleration only, walk back recovery. Directly raises approach velocity, which raises jump height.","fails":"You are running past 25 m — this is not conditioning."}],"stages":[{"stage":"1","weeks":"1-8","goal":"Repeatable clean rim touch","touch":305,"attempts":"5-8","moveOn":"You can touch rim on 4 of 5 attempts when fresh, with a controlled landing every time.","stall":"Strength is the limiter. Stay in Phase 1 an extra 2 weeks rather than advancing."},{"stage":"2","weeks":"9-12","goal":"Full-hand rim grab and brief hang","touch":310,"attempts":"6-8","moveOn":"You can grab and hang from the rim, not just slap it.","stall":"Usually a technique issue: penultimate step too short. Film it from the side."},{"stage":"3","weeks":"13-16","goal":"Wrist above rim / tennis-ball dunk","touch":313,"attempts":"6-10","moveOn":"Multiple tennis-ball makes in one session.","stall":"Grip and ball control, not vertical. Add carries and wrist work on Saturday."},{"stage":"4","weeks":"17-20","goal":"Small ball or volleyball dunk","touch":316,"attempts":"6-10","moveOn":"Two or more clean makes in a session, both hands tried.","stall":"You are close on height but losing the ball at the top. Practise the release, not the jump."},{"stage":"5","weeks":"21-24","goal":"One-hand regulation ball, lob or self-toss","touch":320,"attempts":"8-12","moveOn":"Ball reaches the rim under control, even if it does not go down.","stall":"Expected. This is the honest edge of a 24-week block for this reach."},{"stage":"6","weeks":"Beyond","goal":"Regulation basketball dunk, self-generated","touch":320,"attempts":"8-12","moveOn":"It goes down. Then it goes down twice.","stall":"This is the 12-18 month goal. Block 2 of training, not this one."}],"rules":[{"title":"Warm-up","text":"15 minutes before any jump session, 20 in Phases 4-5. Easy movement, ankle rocks and dorsiflexion drills, calf raises, pogo progression, then 3 submaximal approach jumps. A masters athlete's warm-up is not optional and it does not shorten as the program goes on."},{"title":"Contact caps","text":"Every week on the schedule has a cap. If you exceed it, cut Thursday first, then Tuesday's accessory jumps. Never cut the deload to make room for more jumping."},{"title":"Max jump rest","text":"3 minutes between max approach jumps and dunk attempts. Yes, 3 — it feels absurd and it is the difference between training your peak and training your fatigue."},{"title":"Stop rule","text":"Stop when two consecutive attempts are clearly below your best of the day. That is the nervous system telling you the useful work is finished; everything after is injury risk with no upside."},{"title":"Pain rule","text":"Muscle fatigue and general soreness are fine. Sharp pain, or Achilles/patellar pain that worsens within a session, or pain that is still there on the second morning, means stop and modify. Tendon problems announce themselves quietly and then very loudly."},{"title":"AM tendon check","text":"Rate Achilles and patellar stiffness 1-5 in the first minute out of bed and log it. A 4-5 that persists past 48 hours means the next jump session becomes a mobility session. This single habit prevents most of what goes wrong in dunk programs."},{"title":"Deloads","text":"Weeks 4, 8, 12, 16 and 20 are real. Strength loads drop to ~60-68%, jump volume roughly halves. These are not optional and they are not the weeks to test a new box height."},{"title":"Sunday basketball","text":"Capped at 75 minutes, shooting and movement focus, no max jumping. If Sunday runs long or hard, Monday drops to technique work at 60% and the week continues from there."},{"title":"Sprints","text":"4-6 accelerations of 15-20 m on jump days. Approach velocity is one of the strongest predictors of two-foot jump height, and this is the cheapest way to raise it. Walk back between reps."},{"title":"Technique","text":"Fast, faster, long penultimate step, quick two-foot plant, arms driven up hard. Film from the side every 4 weeks. Most stalled dunk attempts are a short penultimate step, not a weak athlete."},{"title":"Test one-foot too","text":"In Week 1, test your running one-foot jump against your two-foot approach. If one-foot is higher by more than 3 cm, the whole program should pivot to a one-foot approach — the drills change, the strength work barely does. Find this out in Week 1, not Week 20."},{"title":"Testing","text":"Full test on Weeks 4, 8, 12, 16, 20 and 24 only, always fresh, never after a hard session. Do not 1RM test the squat at any point — estimate from a 3-5 rep max instead."},{"title":"Sleep","text":"The most powerful recovery variable available and the one most likely to be the actual limiter. Jump height is measurably lower after short sleep, and tendon repair happens overnight."},{"title":"Bodyweight","text":"Do not deliberately gain weight during this block. Jumping is a power-to-weight event, so strength gained at stable bodyweight is worth more than the same strength 4 kg heavier. Equally, do not under-fuel a program with this much output — that reliably costs both recovery and jump height."},{"title":"Missed sessions","text":"Miss one: skip it, do not stack it onto another day. Miss a week: repeat that week rather than jumping ahead. Miss three weeks: restart from the beginning of the current phase."},{"title":"When to stop the block","text":"Two consecutive test points with no improvement, or any tendon pain lasting more than a week, means the block is over. Take 2 weeks of easy training and restart from Phase 1. That is a normal outcome, not a failure."}],"principles":[{"t":"Tendon before tissue","d":"Achilles and patellar tendon adapt over 8-12 weeks, well behind muscle. Phase 1 runs 8 weeks for that reason alone."},{"t":"Count the contacts","d":"High-intensity takeoffs are the currency. Every week has a cap. Volume creep is the single most common cause of failure here."},{"t":"Real deloads exist","d":"Weeks 4, 8, 12, 16 and 20 are genuine down weeks, not copies of the week before."},{"t":"Two hard jump days","d":"Tue and Thu. Saturday is strength with minimal contacts. Sunday basketball is capped."},{"t":"Strength is the lever","d":"Squat sits near 1.1x bodyweight. That is the largest single pool of untapped vertical in this program."},{"t":"Speed is the other lever","d":"Approach velocity drives two-foot jump height. Short sprints are programmed, not optional."},{"t":"Quality over grinding","d":"Stop max jumping when height visibly drops. Stop lifting when bar speed drops. Never both in one session."},{"t":"Four shots, not one","d":"Dunk-attempt windows at Weeks 12, 16, 20 and 21-24. One peak is one roll of the dice."}],"targets":[{"label":"Week 0 — baseline","vert":70,"touch":300,"gap":20,"milestone":"Almost touching rim","w":0},{"label":"Week 4","vert":71,"touch":301,"gap":19,"milestone":"Landing mechanics clean; no tendon flare","w":4},{"label":"Week 8","vert":73,"touch":303,"gap":17,"milestone":"Squat +10-15%; rim touch repeatable when fresh","w":8},{"label":"Week 12","vert":76,"touch":306,"gap":14,"milestone":"Full-hand rim grab; brief hang","w":12},{"label":"Week 16","vert":79,"touch":309,"gap":11,"milestone":"Wrist clearly above rim; tennis-ball dunk","w":16},{"label":"Week 20","vert":82,"touch":312,"gap":8,"milestone":"Small ball / volleyball dunk","w":20},{"label":"Week 24","vert":84,"touch":314,"gap":6,"milestone":"Clean rim grab + hang; consistent small-ball dunks. Regulation ball = stretch goal.","w":24}],"phases":[{"phase":"Foundation","weeks":"1-8","objective":"Tendon capacity, landing mechanics, base strength","squat":"4x5","jump":"Moderate volume, submax intensity","cap":"60-64"},{"phase":"Strength → Power","weeks":"9-12","objective":"Force production; introduce reactive work","squat":"4x4","jump":"Moderate, first depth jumps","cap":"60"},{"phase":"Elastic Power","weeks":"13-16","objective":"Reactive / stretch-shortening ability","squat":"3x3","jump":"High, short ground contacts","cap":"66"},{"phase":"Max Vertical","weeks":"17-20","objective":"Maximise the two-foot approach jump","squat":"3x3 heavy","jump":"Low volume, max intensity","cap":"48"},{"phase":"Dunk Conversion","weeks":"21-24","objective":"Convert height into made dunks","squat":"2x3 maintenance","jump":"Attempt-driven, high quality","cap":"38"}],"athlete":{"bodyweight":75,"reach":230,"rim":305,"clearance":15,"dunkTouch":320,"squat1rm":81.7,"tb1rm":116.7}}</script>
<script>
/* Rise — 24-week two-foot dunk program tracker */
(function () {
"use strict";

var P = JSON.parse(document.getElementById("program").textContent);
var DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
var DAYNM = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };
var DAYFULL = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday", sat: "Saturday", sun: "Sunday" };
var TESTWK = [4, 8, 12, 16, 20, 24];
var WINDOWWK = [12, 16, 20, 21, 22, 23, 24];
var LS = "rimgap.v1";

/* ---------------- state ---------------- */

var S = {
  settings: {
    bw: P.athlete.bodyweight, reach: P.athlete.reach, rim: P.athlete.rim,
    dunkTouch: P.athlete.dunkTouch,
    sq: [{ w: 1, kg: 70, reps: 5 }], tb: [{ w: 1, kg: 100, reps: 5 }],
    start: null, theme: "auto"
  },
  weeks: {},
  ui: { tab: "today", w: 1, d: "mon", pickW: 1 }
};
var db = null, saveTimers = {};

function blankWeek() { return { updatedAt: 0, d: {}, log: {} }; }
function wk(n) { if (!S.weeks[n]) S.weeks[n] = blankWeek(); return S.weeks[n]; }
function day(n, dk) { var w = wk(n); if (!w.d[dk]) w.d[dk] = { s: {}, ld: {}, reps: {}, hi: null, note: "", done: false }; return w.d[dk]; }
function wid(n) { return "w" + (n < 10 ? "0" + n : n); }

function loadLocal() {
  try {
    var raw = localStorage.getItem(LS);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o.settings) Object.assign(S.settings, o.settings);
    if (o.weeks) S.weeks = o.weeks;
    if (o.ui) Object.assign(S.ui, o.ui);
  } catch (e) { /* first run, or storage blocked */ }
}
function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ settings: S.settings, weeks: S.weeks, ui: S.ui })); }
  catch (e) { /* storage blocked — session-only */ }
}

function touchWeek(n) {
  wk(n).updatedAt = Date.now();
  saveLocal();
  pushWeek(n);
}
function pushWeek(n) {
  if (!db) return;
  clearTimeout(saveTimers[n]);
  saveTimers[n] = setTimeout(function () {
    db.doc("weeks/" + wid(n)).set(JSON.parse(JSON.stringify(S.weeks[n]))).catch(function () {});
  }, 600);
}
function pushSettings() {
  saveLocal();
  if (!db) return;
  clearTimeout(saveTimers.set);
  saveTimers.set = setTimeout(function () {
    db.doc("state/settings").set(JSON.parse(JSON.stringify(
      Object.assign({}, S.settings, { updatedAt: Date.now() })))).catch(function () {});
  }, 600);
}

async function connect() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    db = await window.claude.use("db");
  } catch (e) { db = null; }
  if (!db) return;
  try {
    var snap = await db.doc("state/settings").get();
    if (snap.exists) {
      var rem = snap.data();
      if ((rem.updatedAt || 0) > (S.settings.updatedAt || 0)) Object.assign(S.settings, rem);
    }
    var qs = await db.collection("weeks").get();
    qs.docs.forEach(function (ds) {
      var n = parseInt(ds.id.replace("w", ""), 10);
      var rem = ds.data();
      if (!n || !rem) return;
      if ((rem.updatedAt || 0) >= ((S.weeks[n] && S.weeks[n].updatedAt) || 0)) S.weeks[n] = rem;
    });
    saveLocal();
    render();
    var dot = document.querySelector(".syncdot"); if (dot) dot.classList.add("on");
  } catch (e) { /* offline or refused — local copy stands */ }
}

/* ---------------- backup ---------------- */

function backupBlob() {
  return JSON.stringify({ app: "rimgap", v: 1, saved: new Date().toISOString(), settings: S.settings, weeks: S.weeks }, null, 1);
}
async function exportData() {
  var name = "rise-" + isoDate(new Date()) + ".json";
  var text = backupBlob();
  try {
    if (window.claude && typeof window.claude.use === "function") {
      var dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename: name, data: text }); return; }
    }
  } catch (e) { /* declined or unavailable — fall through to a plain link */ }
  try {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  } catch (e2) { alert("Could not save the file here. Open the app from your home screen and try again."); }
}
function importData(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var o;
    try { o = JSON.parse(fr.result); } catch (e) { return alert("That file is not a Rise backup."); }
    if (!o || o.app !== "rimgap" || !o.weeks) return alert("That file is not a Rise backup.");
    if (!confirm("Replace everything on this device with the backup from " + (o.saved || "").slice(0, 10) + "?")) return;
    Object.assign(S.settings, o.settings || {});
    S.weeks = o.weeks;
    S.settings.updatedAt = Date.now();
    saveLocal(); pushSettings();
    for (var n = 1; n <= 24; n++) if (S.weeks[n]) { S.weeks[n].updatedAt = Date.now(); pushWeek(n); }
    sessCache = {};
    closeSheet();
  };
  fr.readAsText(file);
}

/* ---------------- math ---------------- */

function e1rm(w, r) { return w * (1 + r / 30); }
function r25(x) { return Math.round(x / 2.5) * 2.5; }
function fmtKg(x) { return (Math.round(x * 10) / 10).toString().replace(/\.0$/, ""); }

function testFor(list, week) {
  var best = null;
  (list || []).forEach(function (t) { if (t && t.kg && t.reps && t.w <= week) { if (!best || t.w > best.w) best = t; } });
  return best;
}
function oneRM(kind, week) {
  var t = testFor(S.settings[kind], week);
  return t ? e1rm(t.kg, t.reps) : null;
}
function strengthFor(week) {
  var row = P.strength[week - 1];
  var sq = oneRM("sq", week), tb = oneRM("tb", week);
  var sqKg = sq ? r25(sq * row.squat_pct) : null;
  return {
    row: row,
    sqKg: sqKg, sq1: sq,
    tbKg: tb ? r25(tb * row.tb_pct) : null, tb1: tb,
    fsKg: sqKg ? r25(sqKg * 0.72) : null
  };
}
function targetAt(week) {
  var t = P.targets, i;
  for (i = 0; i < t.length; i++) if (t[i].w === week) return t[i].touch;
  for (i = 0; i < t.length - 1; i++) {
    if (week > t[i].w && week < t[i + 1].w) {
      var f = (week - t[i].w) / (t[i + 1].w - t[i].w);
      return t[i].touch + f * (t[i + 1].touch - t[i].touch);
    }
  }
  return t[t.length - 1].touch;
}
function bestTouch() {
  var b = null, bw = null;
  for (var n = 1; n <= 24; n++) {
    var l = S.weeks[n] && S.weeks[n].log;
    if (l && l.app && (b === null || l.app > b)) { b = l.app; bw = n; }
  }
  return { v: b, w: bw };
}
function currentStage(week) {
  for (var i = 0; i < P.stages.length; i++) {
    var r = (P.stages[i].weeks || "").split("-");
    var a = parseInt(r[0], 10), z = parseInt(r[1], 10);
    if (!isNaN(a) && !isNaN(z) && week >= a && week <= z) return i;
  }
  return P.stages.length - 1;
}

/* week/day from the start date */
function startDate() {
  if (!S.settings.start) return null;
  var p = S.settings.start.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function todayPos() {
  var sd = startDate();
  if (!sd) return null;
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var diff = Math.floor((now - sd) / 86400000);
  if (diff < 0) return { w: 1, d: "mon", before: true };
  var w = Math.floor(diff / 7) + 1;
  if (w > 24) return { w: 24, d: "sun", after: true };
  return { w: w, d: DAYS[diff % 7] };
}
function dateOf(week, dk) {
  var sd = startDate(); if (!sd) return null;
  var dd = new Date(sd.getTime());
  dd.setDate(dd.getDate() + (week - 1) * 7 + DAYS.indexOf(dk));
  return dd;
}
function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* ---------------- parsing the program text ---------------- */

var SETRE = /(\d+)\s*[x×]\s*(\d+)/;

/* Which drills cost a hard jump, and how many per set.
   Matched against the programme's own wording. Pogos, snap-downs, bounds,
   altitude landings, jump squats and sprints are tissue-tolerance work and
   cost nothing. This reproduces the workbook's own weekly totals on 67 of its
   72 scheduled days; the handful that differ are inconsistencies in the sheet
   itself, and this errs toward counting rather than missing them. */
/* Drills where a kilo box would be meaningless. */
/* Substitutions. The sets and reps stay as written; only the lift changes,
   and each swap keeps the job the original was doing. */
var SUBS = [
  [/front squat/i, "Leg press (or goblet squat)"],
  [/nordic curl/i, "Lying hamstring curl (or ball curl)"]
];
function applySubs(line) {
  for (var i = 0; i < SUBS.length; i++) line = line.replace(SUBS[i][0], SUBS[i][1]);
  return line;
}

var NOLOAD_PAT = /pogo|snap.?down|bound|sprint|mobility|shooting|warm.?up|altitude landing|stretch|test|reach/i;

var HI_PAT = /cmj|countermovement|approach jump|approach touch|broad jump|rim.?touch|box jump|depth jump|hurdle jump|dunk attempt|attempts|max touch|trap-bar jump/i;
/* Accessories carry no prescribed load in the programme, so suggest a
   sensible first weight from your tested maxes. These are starting points,
   not targets: the last rep of the last set should still be clean with two
   or three left in you. Once you log a weight it becomes the suggestion. */
var SUGGEST = [
  [/rdl|romanian/i,            { of: "tb", f: 0.50 }],
  [/hip thrust/i,              { of: "sq", f: 0.70 }],
  [/bulgarian|split squat/i,   { of: "sq", f: 0.25, note: "total, so half that in each hand" }],
  [/seated calf/i,             { of: "sq", f: 0.35 }],
  [/standing calf/i,           { of: "sq", f: 0.50 }],
  [/tibialis/i,                { flat: 5 }],
  [/trap-bar jump|jump squat/i,{ of: "bw", f: 0.25, note: "20-30% of bodyweight" }],
  [/nordic|ab wheel|pallof|sit-?up|leg raise|back extension|pull-?up|scapular/i, { body: true }]
];
function nameKey(s) {
  return String(s).toLowerCase().replace(/\(.*?\)/g, "").replace(/[0-9]+\s*[x×]\s*[0-9]+.*$/, "")
    .replace(/[^a-z ]/g, "").trim().replace(/\s+/g, "-");
}
function suggestLoad(text, week) {
  for (var i = 0; i < SUGGEST.length; i++) {
    if (SUGGEST[i][0].test(text)) {
      var r = SUGGEST[i][1];
      if (r.body) return { body: true };
      if (r.flat) return { kg: r.flat };
      var base = r.of === "bw" ? +S.settings.bw : oneRM(r.of, week);
      return base ? { kg: r25(base * r.f), note: r.note } : null;
    }
  }
  return null;
}

var LI_PAT = /jump squat|pogo|snap.?down|bound|altitude landing|sprint/i;

/* Contacts earned by ONE set of this line. */
function hiPerSet(line) {
  if (LI_PAT.test(line) || !HI_PAT.test(line)) return 0;
  var m = line.match(SETRE);
  if (m) return +m[2];
  var n = line.match(/([0-9]+)/);
  return n ? +n[1] : 0;
}

/* Upper body — two sessions, Push on Monday and Pull on Wednesday.
   Four sets on everything, every week: upper work does not load the Achilles,
   so it is not what the deload weeks exist to protect. */
/* Wednesday core and mobility. Bodyweight throughout, so no weight boxes.
   The two ankle and hip drills are the ones that matter for jumping: shallow
   dorsiflexion shortens your plant, and tight hip flexors cost you extension. */
var CORE = {
  title: "Core", meta: "zero lower impact",
  ex: [
    { name: "Plank", sets: 3, reps: "45 s" },
    { name: "Side plank", sets: 3, reps: "30 s / side" },
    { name: "Dead bug", sets: 3, reps: "10 / side" },
    { name: "Russian twist", sets: 3, reps: "20" }
  ]
};
var MOBILITY = {
  title: "Mobility", meta: "~10 min",
  ex: [
    { name: "Knee-to-wall ankle stretch", sets: 2, reps: "30 s / side", why: "deeper plant" },
    { name: "Kneeling hip flexor stretch", sets: 2, reps: "30 s / side", why: "full extension at takeoff" },
    { name: "Seated 90/90 hip rotation", sets: 2, reps: "5 / side" },
    { name: "Hamstring stretch", sets: 2, reps: "30 s / side" },
    { name: "Calf stretch, straight and bent knee", sets: 2, reps: "30 s / side" }
  ]
};

var UPPER = {
  A: {
    title: "Push", meta: "~30 min",
    ex: [
      { name: "Bench press", sets: 4, reps: "8" },
      { name: "Incline bench press", sets: 4, reps: "8" },
      { name: "Shoulder press", sets: 4, reps: "8" },
      { name: "Lateral raise", sets: 4, reps: "10" },
      { name: "Sit-ups", sets: 4, reps: "25" }
    ]
  },
  B: {
    title: "Pull", meta: "~35 min",
    ex: [
      { name: "Pull-ups", sets: 4, reps: null, count: true, note: "log every rep" },
      { name: "Chest row", sets: 4, reps: "10" },
      { name: "Single-arm DB row", sets: 4, reps: "10 / side" },
      { name: "Back extension", sets: 4, reps: "12" },
      { name: "Lower-ab leg raise", sets: 4, reps: "15" }
    ]
  }
};

function classify(line) {
  if (/^[A-Z][A-Z0-9-]{3,}(\s|$)/.test(line) && !SETRE.test(line)) return "head";
  if (/^(cut |stop |log |zero |then |full rest|no lifting|no max|shooting \+|or full rest|movement only)/i.test(line)) return "note";
  if (/\.$/.test(line) && !SETRE.test(line)) return "note";
  return "ex";
}
function parseLine(line) {
  var m = line.match(SETRE);
  return { text: line, sets: m ? +m[1] : 1, reps: m ? m[2] : null, hasSets: !!m };
}
function libSets(s) {
  var m = String(s).match(SETRE);
  return m ? +m[1] : 1;
}

/* Build every session for one day of one week. */
var sessCache = {};
function sessionsFor(week) {
  var st0 = strengthFor(week);
  var ck = week + "|" + st0.sqKg + "|" + st0.tbKg;
  if (sessCache[week] && sessCache[week].k === ck) return sessCache[week].v;
  var v = buildSessions(week, st0);
  sessCache[week] = { k: ck, v: v };
  return v;
}
function buildSessions(week, st) {
  var W = P.weeks[week - 1];
  var deload = /DELOAD/i.test(W.load);
  var lateBlock = week >= 17;

  function loadTag(line) {
    if (/back squat/i.test(line)) {
      return { scheme: st.row.squat_scheme, kg: st.sqKg, pct: st.row.squat_pct };
    }
    if (/trap-bar deadlift/i.test(line)) {
      return { scheme: st.row.tb_scheme, kg: st.tbKg, pct: st.row.tb_pct };
    }
    if (/front squat/i.test(line)) return { scheme: null, kg: st.fsKg, pct: null };
    return null;
  }
  function items(lines, id) {
    return lines.map(function (line, i) {
      line = applySubs(line);
      var per = hiPerSet(line);
      var kind = per > 0 ? "ex" : classify(line);   // anything that scores is trackable
      if (kind !== "ex") return { kind: kind, text: line };
      var p = parseLine(line), tag = loadTag(line);
      if (tag) {
        if (tag.scheme) { p.sets = libSets(tag.scheme); p.reps = tag.scheme.split(/[x×]/)[1]; p.hasSets = true; }
        p.kg = tag.kg; p.pct = tag.pct;
        p.text = line.replace(/\s*\(Strength tab\)/i, "").replace(SETRE, tag.scheme || "$&");
      }
      p.kind = "ex"; p.key = id + ":" + i; p.hiPer = per;
      p.loggable = p.hasSets && !per && !NOLOAD_PAT.test(line);
      if (p.loggable) p.sugg = suggestLoad(line, week);
      return p;
    });
  }
  function fixedBlock(lib, id, cap) {
    return {
      id: id, title: lib.title, meta: lib.meta, hi: 0,
      items: lib.ex.map(function (e, i) {
        var n = Math.min(e.sets, cap);
        return {
          kind: "ex", key: id + ":" + i, text: e.name, sets: n, hasSets: true,
          reps: e.reps, loggable: false,
          detail: n + " x " + e.reps + (e.why ? "  ·  " + e.why : "")
        };
      })
    };
  }
  function upper(letter, id) {
    var lib = UPPER[letter]; if (!lib) return null;
    var cap = 99;
    return {
      id: id, title: lib.title, meta: lib.meta, hi: 0,
      items: lib.ex.map(function (e, i) {
        var n = Math.min(e.sets, cap);
        return {
          kind: "ex", key: id + ":" + i, text: e.name, sets: n, hasSets: true,
          reps: e.reps, count: !!e.count,
          loggable: !e.count, sugg: suggestLoad(e.name, week),
          detail: n + " x " + (e.count ? "max" : e.reps) + (e.note ? "  ·  " + e.note : "")
        };
      })
    };
  }

  var out = { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] };

  out.mon.push({ id: "mon-lower", title: "Lower strength", meta: st.row.squat_scheme + " squat · " + Math.round(st.row.squat_pct * 100) + "%", hi: 0, items: items(W.mon_lower, "mon-lower") });
  if (/Upper A/i.test(W.mon_upper)) out.mon.push(upper("A", "mon-upperA"));
  else if (W.mon_upper) out.mon.push({ id: "mon-up", title: W.mon_upper.split("\n")[0], meta: "", hi: 0, items: items(W.mon_upper.split("\n"), "mon-up") });

  out.tue.push({ id: "tue", title: "Jump + court", meta: "primary jump day", hi: W.tue_hi || 0, items: items(W.tue_jump, "tue") });

  if (W.wed.some(function (l) { return /Upper B/i.test(l); })) out.wed.push(upper("B", "wed-upperB"));
  out.wed.push(fixedBlock(CORE, "wed-core", deload ? 2 : 99));
  out.wed.push(fixedBlock(MOBILITY, "wed-mob", 99));

  out.thu.push({ id: "thu", title: "Explosive", meta: "nervous-system day", hi: W.thu_hi || 0, items: items(W.thu, "thu") });
  out.fri.push({ id: "fri", title: "Rest", meta: "protected", hi: 0, items: items(W.fri, "fri") });

  out.sat.push({ id: "sat-lower", title: /DUNK WINDOW|TEST/i.test(W.sat_lower.join(" ")) ? "Dunk window" : "Lower power", meta: st.row.tb_scheme + " trap-bar", hi: W.sat_hi || 0, items: items(W.sat_lower, "sat-lower") });

  out.sun.push({
    id: "sun", title: "Rest", meta: "free day", hi: 0,
    items: [{ kind: "note", text: "No session scheduled. If you play, keep it easy and off the max jumps — Tuesday is the day that needs your legs." }]
  });

  Object.keys(out).forEach(function (k) { out[k] = out[k].filter(Boolean); });
  return out;
}

/* Planned contacts for a day: every scoring set in the session. */
function plannedHI(week, dk) {
  var tot = 0;
  sessionsFor(week)[dk].forEach(function (s) {
    s.items.forEach(function (it) { if (it.hiPer) tot += it.hiPer * (it.hasSets ? it.sets : 1); });
  });
  return tot;
}

/* Contacts actually earned: only the sets you have ticked off. */
function actualHI(week, dk) {
  var rec = wk(week).d[dk], tot = 0;
  if (!rec) return 0;
  sessionsFor(week)[dk].forEach(function (s) {
    s.items.forEach(function (it) {
      if (!it.hiPer) return;
      var arr = rec.s[it.key] || [];
      var n = it.hasSets ? it.sets : 1;
      for (var i = 0; i < n; i++) if (arr[i]) tot += it.hiPer;
    });
  });
  return tot;
}

/* Which drills contributed, for the breakdown under the counter. */
function hiBreakdown(week, dk) {
  var rec = wk(week).d[dk], out = [];
  sessionsFor(week)[dk].forEach(function (s) {
    s.items.forEach(function (it) {
      if (!it.hiPer) return;
      var arr = (rec && rec.s[it.key]) || [];
      var n = it.hasSets ? it.sets : 1, done = 0;
      for (var i = 0; i < n; i++) if (arr[i]) done++;
      out.push({ name: it.text, done: done * it.hiPer, plan: n * it.hiPer });
    });
  });
  return out;
}

function weekHI(week) {
  var plan = 0, act = 0;
  DAYS.forEach(function (dk) { plan += plannedHI(week, dk); act += actualHI(week, dk); });
  return { plan: plan, total: act };
}
function loggedHI(week) {
  var t = 0;
  DAYS.forEach(function (dk) { t += actualHI(week, dk); });
  return t;
}

function dayProgress(week, dk) {
  var ss = sessionsFor(week)[dk], done = 0, tot = 0;
  ss.forEach(function (s) {
    s.items.forEach(function (it) {
      if (it.kind !== "ex") return;
      var n = it.hasSets ? it.sets : 1;
      tot += n;
      var rec = wk(week).d[dk];
      var arr = it.count
        ? ((rec && rec.reps && rec.reps[it.key]) || [])
        : ((rec && rec.s[it.key]) || []);
      for (var i = 0; i < n; i++) if (it.count ? (+arr[i] > 0) : arr[i]) done++;
    });
  });
  return { done: done, total: tot };
}

/* ---------------- logged weights ---------------- */

/* Strip the prescription off an exercise line so it reads as a lift name. */
function liftLabel(s) {
  return String(s).replace(/\(.*?\)/g, "")
    .replace(/[0-9]+\s*[x×]\s*[0-9]+.*$/, "")
    .replace(/\s+/g, " ").trim();
}

/* { nameKey: {label, points:[{w, kg}]} } across all 24 weeks, in week order. */
function liftSeries() {
  var map = {};
  for (var n = 1; n <= 24; n++) {
    var W = S.weeks[n];
    if (!W || !W.d) continue;
    var built = sessionsFor(n);
    DAYS.forEach(function (dk) {
      var rec = W.d[dk];
      if (!rec || !rec.ld) return;
      built[dk].forEach(function (s) {
        s.items.forEach(function (it) {
          var e = rec.ld[it.key];
          if (!e || e.w == null || e.w === "") return;
          var k = nameKey(it.text);
          if (!map[k]) map[k] = { label: liftLabel(it.text), points: [] };
          map[k].points.push({ w: n, kg: +e.w });
        });
      });
    });
  }
  Object.keys(map).forEach(function (k) {
    map[k].points.sort(function (a, b) { return a.w - b.w; });
  });
  return map;
}

function liftChartSVG(series) {
  var W = 340, H = 150, L = 34, R = 10, TP = 12, B = 20;
  var pts = series.points;
  var lo = Math.min.apply(null, pts.map(function (p) { return p.kg; }));
  var hi = Math.max.apply(null, pts.map(function (p) { return p.kg; }));
  if (hi - lo < 5) { lo -= 2.5; hi += 2.5; }
  var pad = (hi - lo) * 0.15;
  lo -= pad; hi += pad;
  function x(w) { return L + (w / 24) * (W - L - R); }
  function y(v) { return TP + (1 - (v - lo) / (hi - lo)) * (H - TP - B); }

  var s = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="' +
    esc(series.label) + ' weight by week">';
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(function (v) {
    s += '<line x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(v).toFixed(1) +
      '" stroke="var(--line-soft)" stroke-width="1"></line>' +
      '<text x="' + (L - 5) + '" y="' + (y(v) + 3.2).toFixed(1) + '" text-anchor="end" fill="var(--faint)" ' +
      'font-family="IBM Plex Mono, monospace" font-size="9">' + fmtKg(Math.round(v * 2) / 2) + "</text>";
  });
  if (pts.length > 1) {
    s += '<polyline points="' + pts.map(function (p) { return x(p.w).toFixed(1) + "," + y(p.kg).toFixed(1); }).join(" ") +
      '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></polyline>';
  }
  pts.forEach(function (p, i) {
    var last = i === pts.length - 1;
    s += '<circle cx="' + x(p.w).toFixed(1) + '" cy="' + y(p.kg).toFixed(1) + '" r="' + (last ? 4.5 : 3) +
      '" fill="var(--accent)"></circle>';
    if (last) {
      s += '<text x="' + (x(p.w) > W - 70 ? x(p.w) - 8 : x(p.w) + 8).toFixed(1) + '" y="' + (y(p.kg) - 7).toFixed(1) +
        '" fill="var(--accent)" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" ' +
        'text-anchor="' + (x(p.w) > W - 70 ? "end" : "start") + '">' + fmtKg(p.kg) + " kg</text>";
    }
  });
  [1, 8, 16, 24].forEach(function (w) {
    s += '<text x="' + x(w).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" fill="var(--faint)" ' +
      'font-family="IBM Plex Mono, monospace" font-size="9">wk ' + w + "</text>";
  });
  return s + "</svg>";
}

/* ---------------- session length ---------------- */

/* Minutes per set, rest included — the rest is most of it. Max-effort jumps
   carry three minutes each, which is why the jump days run long. */
/* The drills the rest guide calls non-negotiable: every max-effort takeoff,
   plus heavy triples on the two main bars. */
function needsLongRest(it) {
  if (it.hiPer && /approach|rim.?touch|dunk|depth|max touch/i.test(it.text)) return true;
  if (/back squat|trap-bar deadlift/i.test(it.text) && it.reps && +it.reps <= 3) return true;
  return false;
}
function setCost(it) {
  var x = it.text;
  if (it.hiPer) return /approach|rim.?touch|dunk|depth|max touch/i.test(x) ? 3.3 : 2.3;
  if (LI_PAT.test(x)) return 1.3;
  if (/back squat|trap-bar deadlift/i.test(x)) return 3.0;
  if (/plank|dead bug|twist|stretch|rotation|90\/90/i.test(x)) return 1.1;
  return 1.7;
}
function sessionMinutes(s) {
  var t = 0;
  s.items.forEach(function (it) {
    if (it.kind !== "ex") return;          // notes are instructions, not work
    if (it.hasSets) {
      t += it.sets * setCost(it);
      if (/back squat|trap-bar deadlift/i.test(it.text)) t += 6;   // ramp-up sets
    } else {
      var m = it.text.match(/([0-9]+)\s*min/);
      t += m ? +m[1] : 2;
    }
  });
  return Math.max(5, Math.round(t / 5) * 5);
}
function dayMinutes(week, dk) {
  return sessionsFor(week)[dk].reduce(function (a, s) { return a + sessionMinutes(s); }, 0);
}
function fmtMins(m) {
  if (m < 60) return m + " min";
  var h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + r : "");
}

/* ---------------- tiny DOM helpers ---------------- */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function el(id) { return document.getElementById(id); }

/* ---------------- rest timer ---------------- */

var T = { end: 0, len: 0, tick: null, lock: null };
function startTimer(sec) {
  T.len = sec; T.end = Date.now() + sec * 1000;
  if (!T.tick) T.tick = setInterval(paintTimer, 250);
  requestWake();
  paintTimer();
}
function stopTimer() {
  T.end = 0; clearInterval(T.tick); T.tick = null; releaseWake(); paintTimer();
}
async function requestWake() {
  try { if (navigator.wakeLock && !T.lock) T.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWake() { try { if (T.lock) { T.lock.release(); T.lock = null; } } catch (e) {} }
function paintTimer() {
  var host = el("timerHost");
  if (!T.end) { host.innerHTML = ""; return; }
  var left = Math.round((T.end - Date.now()) / 1000);
  if (left <= -20) { stopTimer(); return; }
  var over = left <= 0;
  if (over && !T.buzzed) { T.buzzed = true; try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {} }
  if (!over) T.buzzed = false;
  var v = Math.abs(left);
  var txt = Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0");
  host.innerHTML =
    '<div class="timer ' + (over ? "done" : "run") + '">' +
    '<small>' + (over ? "go" : "rest") + '</small>' +
    '<span>' + txt + '</span>' +
    '<button class="x" data-act="tstop" aria-label="Stop timer">&times;</button></div>';
}

function ring(done, total) {

    '<circle cx="12" cy="12" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round"' +
    ' stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 12 12)"></circle>' +
    "</svg></span>";

  if (it.count) {

    var tot = 0;

function posForDate(dt) {
  var sd = startDate(); if (!sd) return null;
  var diff = Math.round((new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()) - sd) / 86400000);
  if (diff < 0) return null;
  var w = Math.floor(diff / 7) + 1;
  if (w > 24) return null;
  return { w: w, d: DAYS[diff % 7] };
}

    '<div class="barlab"><span>' + hi.total + " of " + hi.plan + " hard jumps done</span><span>cap " + cap + "</span></div>" +
